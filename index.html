<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM CORP | SECURITY INTERFACE</title>
    <style>
        body { margin: 0; background: #000; color: #f00; font-family: 'Courier New', monospace; overflow: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.4; }
        
        /* UI Layer */
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        
        /* 1. Arcfelismerő ablak */
        #camera-box { position: absolute; top: 20px; left: 20px; width: 150px; height: 110px; border: 2px solid #f00; background: #050000; pointer-events: auto; }
        #webcam { width: 100%; height: 100%; object-fit: cover; filter: sepia(1) saturate(5) hue-rotate(-50deg); }
        .scanner-line { position: absolute; width: 100%; height: 2px; background: rgba(255,0,0,0.5); top: 0; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* Központi tartalom */
        .header { margin-top: 150px; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #f00; letter-spacing: 5px; }
        #status { margin: 20px; color: #f00; font-weight: bold; }
        
        .input-box { pointer-events: auto; background: rgba(20,0,0,0.8); border: 1px solid #f00; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        input { background: #000; border: 1px solid #600; color: #f00; padding: 10px; text-align: center; margin-bottom: 10px; }
        button { background: #800; color: #fff; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:active { background: #f00; }

        /* Világtérkép háttér (szimuláció) */
        #map-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg') no-repeat center; background-size: cover; opacity: 0.1; filter: invert(1) sepia(1) saturate(10) hue-rotate(-50deg); }

        /* Riasztás villogás */
        .alarm-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.5); z-index: 100; display: none; pointer-events: none; }
    </style>
</head>
<body>

    <div id="map-overlay"></div>
    <div id="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scanner-line"></div>
        <div style="position:absolute; bottom:0; width:100%; font-size:8px; background:rgba(255,0,0,0.5); color:white;">FACIAL_SCAN: ACTIVE</div>
    </div>

    <div id="ui">
        <div class="header">PHANTOM CORP.</div>
        <div id="status">[ RENDSZER ÁLLAPOT: FIGYELÉS ]</div>
        
        <div class="input-box">
            <input type="password" id="admin-code" placeholder="ADMINISZTRÁTORI KÓD">
            <button onclick="verifyAccess()">BELÉPÉS</button>
        </div>
    </div>

    <div id="alarm" class="alarm-flash"></div>

    <script>
        // 1. Kamera indítása
        const video = document.getElementById('webcam');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
            }).catch(err => console.log("Kamera hiba: ", err));
        }

        // 3. Hangpszichológia és ellenőrzés
        function verifyAccess() {
            const code = document.getElementById('admin-code').value;
            const status = document.getElementById('status');
            const alarm = document.getElementById('alarm');

            if (code === '1234') {
                status.innerText = "[ HOZZÁFÉRÉS MEGADVA: ÜDVÖZÖLJÜK, LORD ]";
                status.style.color = "#0f0";
                playVoice("Welcome, Lord.");
            } else {
                status.innerText = "[ ILLETÉKTELEN BEHATOLÁS! ]";
                status.style.color = "#fff";
                
                // Villogás
                alarm.style.display = "block";
                setTimeout(() => alarm.style.display = "none", 100);
                setTimeout(() => alarm.style.display = "block", 200);
                setTimeout(() => alarm.style.display = "none", 300);

                // PSZICHOLÓGIA: Hang és értesítés
                playVoice("Unauthorized access. Security protocol activated. GPS coordinates sent to police headquarters.");
                alert("RENDŐRSÉGI RIASZTÁS: Csendes riasztás aktiválva. GPS koordináták elküldve.");
                
                if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            }
            document.getElementById('admin-code').value = '';
        }

        function playVoice(text) {
            const msg = new SpeechSynthesisUtterance();
            msg.text = text;
            msg.lang = 'en-US';
            msg.pitch = 0.5; // Mély hacker hang
            msg.rate = 0.8;
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
