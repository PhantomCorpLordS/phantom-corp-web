<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM CORP | WHATSAPP SECURITY</title>
    <style>
        body { margin: 0; background: #000; color: #f00; font-family: 'Courier New', monospace; overflow: hidden; }
        #map-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg') no-repeat center; background-size: cover; opacity: 0.15; filter: invert(1) sepia(1) saturate(20) hue-rotate(-50deg); }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: rgba(10,0,0,0.95); border: 2px solid #f00; padding: 30px; text-align: center; z-index: 10; box-shadow: 0 0 20px #f00; }
        input { background: #111; border: 1px solid #f00; color: #f00; padding: 12px; width: 85%; text-align: center; font-size: 18px; margin: 15px 0; }
        button { background: #f00; color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }
        #camera-ui { position: absolute; top: 20px; left: 20px; width: 160px; height: 120px; border: 2px solid #f00; background: #000; }
        #webcam { width: 100%; height: 100%; object-fit: cover; filter: sepia(1) hue-rotate(-50deg); }
        #admin-panel { display: none; position: fixed; top: 5%; left: 5%; width: 90%; height: 90%; background: #050505; border: 3px solid #25d366; z-index: 100; padding: 20px; color: #25d366; overflow-y: auto; box-sizing: border-box; }
        .admin-input { border: 1px solid #25d366; background: #000; color: #25d366; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        .alarm { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.5); display: none; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

<div id="map-overlay"></div>
<div id="camera-ui"><video id="webcam" autoplay playsinline muted></video></div>

<div id="ui">
    <h2 id="logo-trigger" style="cursor:help;">PHANTOM CORP.</h2>
    <p id="status">[ WHATSAPP VÉDELEM AKTÍV ]</p>
    <input type="password" id="pass-input" placeholder="BIZTONSÁGI KÓD">
    <button onclick="verify()">RENDSZER BELÉPÉS</button>
</div>

<div id="admin-panel">
    <h2 style="color:#25d366;">WHATSAPP KONFIGURÁCIÓ</h2>
    <label>Vevő WhatsApp száma (pl: +36301234567):</label>
    <input type="text" id="conf-phone" class="admin-input">
    <label>Saját Belépési Kód:</label>
    <input type="text" id="conf-code" class="admin-input">
    <label>Twilio Account SID:</label>
    <input type="text" id="conf-sid" class="admin-input">
    <label>Twilio Auth Token:</label>
    <input type="password" id="conf-token" class="admin-input">
    <hr>
    <p style="font-size: 12px;">*A WhatsApp üzenetekhez a Twilio Sandbox beállítása szükséges.</p>
    <button style="background:#25d366;" onclick="saveConfig()">MENTÉS ÉS AKTIVÁLÁS</button>
    <button style="background:#444; margin-top:10px;" onclick="document.getElementById('admin-panel').style.display='none'">MÉGSE</button>
</div>

<div id="alarm" class="alarm"></div>
<canvas id="snapshot" style="display:none;"></canvas>

<script>
    const video = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

    let config = JSON.parse(localStorage.getItem('phantomConfig')) || {
        phone: "", code: "1234", sid: "", token: ""
    };

    // Admin panel megnyitása: hosszú nyomás a logón (2mp)
    let pressTimer;
    document.getElementById('logo-trigger').addEventListener('touchstart', () => pressTimer = setTimeout(() => document.getElementById('admin-panel').style.display='block', 2000));
    document.getElementById('logo-trigger').addEventListener('touchend', () => clearTimeout(pressTimer));
    document.getElementById('logo-trigger').addEventListener('mousedown', () => pressTimer = setTimeout(() => document.getElementById('admin-panel').style.display='block', 2000));
    document.getElementById('logo-trigger').addEventListener('mouseup', () => clearTimeout(pressTimer));

    function saveConfig() {
        config.phone = document.getElementById('conf-phone').value;
        config.code = document.getElementById('conf-code').value;
        config.sid = document.getElementById('conf-sid').value;
        config.token = document.getElementById('conf-token').value;
        localStorage.setItem('phantomConfig', JSON.stringify(config));
        document.getElementById('admin-panel').style.display='none';
        alert("WhatsApp konfiguráció mentve!");
    }

    function verify() {
        if(document.getElementById('pass-input').value === config.code) {
            document.getElementById('status').innerText = "HOZZÁFÉRÉS MEGADVA.";
            document.getElementById('status').style.color = "#0f0";
        } else {
            sendWhatsAppAlert();
        }
    }

    function sendWhatsAppAlert() {
        document.getElementById('alarm').style.display = 'block';
        setTimeout(() => document.getElementById('alarm').style.display = 'none', 500);
        
        // Twilio API hívás (WhatsApp)
        if(config.sid && config.token && config.phone) {
            const url = `https://api.twilio.com/2010-04-01/Accounts/${config.sid}/Messages.json`;
            const auth = btoa(`${config.sid}:${config.token}`);
            
            const formData = new URLSearchParams();
            formData.append('To', `whatsapp:${config.phone}`);
            formData.append('From', 'whatsapp:+14155238886'); // Ez a Twilio alap Sandbox száma
            formData.append('Body', '⚠️ PHANTOM CORP RIASZTÁS! Illetéktelen belépési kísérlet észlelve!');

            fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Basic ${auth}`, 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(() => alert("WhatsApp riasztás elküldve a vevőnek!"));
        } else {
            alert("RENDŐRSÉGI RIASZTÁS! (Állítsd be a Twilio adatokat az Admin panelen a valódi WhatsApphoz!)");
        }
    }
</script>
</body>
</html>
