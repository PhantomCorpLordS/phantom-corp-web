<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PHANTOM CORP | SECURE INTERFACE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #f00; font-family: 'Courier New', monospace; overflow: hidden; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border: 2px solid #300; box-sizing: border-box; }
        .logo { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; letter-spacing: 5px; text-shadow: 0 0 10px red; pointer-events: auto; }
        .status { position: absolute; bottom: 20px; left: 20px; font-size: 12px; color: #600; }
        .chucky-code { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); font-size: 10px; width: 100px; word-break: break-all; opacity: 0.5; }
        #news-feed { position: absolute; top: 80px; left: 20px; width: 250px; font-size: 12px; background: rgba(20,0,0,0.8); padding: 10px; border-left: 3px solid #f00; pointer-events: auto; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="logo">PHANTOM CORP.</div>
        <div id="news-feed">
            [SYS_MSG]: Rendszer aktív...<br>
            [ALERT]: Behatolás érzékelve...<br>
            [INTEL]: Chucky protokoll fut...
        </div>
        <div class="chucky-code">01000011 01101000 01110101 01100011 01101011 01111001 01000011 01101000 01110101 01100011 01101011 01111001</div>
        <div class="status">ENCRYPTION: 4096-BIT | LOCATION: HIDDEN</div>
    </div>

    <script>
        // 3D CORE ANIMÁCIÓ
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // A MAG (Ez lesz a koponya helye, de most egy lüktető rácsos alakzat)
        const geometry = new THREE.IcosahedronGeometry(2, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
        const core = new THREE.Mesh(geometry, material);
        scene.add(core);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            core.rotation.y += 0.01;
            core.rotation.x += 0.005;
            let s = 1 + Math.sin(Date.now() * 0.002) * 0.1;
            core.scale.set(s, s, s);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
