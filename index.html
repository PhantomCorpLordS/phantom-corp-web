<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHANTOM CORP | RED NEON V8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #f00; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        
        /* Kicsi, professzionális belépő panel */
        #login-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 260px; background: rgba(10, 0, 0, 0.95);
            border: 1px solid #f00; padding: 15px; text-align: center;
            z-index: 100; box-shadow: 0 0 20px #500;
        }
        
        input { background: #000; border: 1px solid #800; color: #f00; width: 85%; padding: 10px; margin: 10px 0; text-align: center; font-size: 16px; outline: none; }
        button { background: #800; color: #fff; border: none; padding: 10px; font-weight: bold; cursor: pointer; width: 93%; text-transform: uppercase; }
        button:active { background: #f00; }

        /* Megfigyelő Kamera (Kicsi) */
        #camera-ui { position: absolute; top: 15px; right: 15px; width: 130px; height: 100px; border: 1px solid #f00; background: #000; z-index: 50; box-shadow: 0 0 10px #500; }
        #webcam { width: 100%; height: 100%; object-fit: cover; filter: sepia(1) saturate(2) hue-rotate(-50deg) contrast(1.2); }

        /* Rejtett Admin Panel (WhatsApp beállításhoz) */
        #admin-panel { display: none; position: fixed; top: 5%; left: 5%; width: 90%; height: 90%; background: #050505; border: 2px solid #25d366; z-index: 200; padding: 20px; color: #25d366; overflow-y: auto; box-sizing: border-box; }
        .admin-input { border: 1px solid #25d366; background: #000; color: #25d366; width: 100%; margin-bottom: 10px; padding: 8px; }

        .alarm-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.6); display: none; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

    <div id="admin-trigger" style="position:absolute; top:0; left:0; width:60px; height:60px; z-index:300;"></div>

    <div id="camera-ui"><video id="webcam" autoplay playsinline muted></video></div>

    <div id="login-panel">
        <div style="font-size: 14px; letter-spacing: 3px; font-weight: bold;">PHANTOM CORP</div>
        <input type="password" id="pass" placeholder="SECURITY CODE">
        <button onclick="checkAccess()">LOG IN</button>
        <div id="status" style="font-size: 9px; margin-top: 5px; opacity: 0.7;">ENCRYPTED SESSION ACTIVE</div>
    </div>

    <div id="admin-panel">
        <h2>WA CONFIGURATION</h2>
        <label>WhatsApp Number (+36...):</label><br><input type="text" id="c-phone" class="admin-input"><br>
        <label>Passcode:</label><br><input type="text" id="c-code" class="admin-input"><br>
        <label>Twilio SID:</label><br><input type="text" id="c-sid" class="admin-input"><br>
        <label>Twilio Token:</label><br><input type="password" id="c-token" class="admin-input"><br>
        <button style="background:#25d366; color:#000;" onclick="saveConfig()">SAVE CONFIG</button>
        <button style="background:#333; color:#fff; margin-top:10px;" onclick="document.getElementById('admin-panel').style.display='none'">CLOSE</button>
    </div>

    <div id="alarm" class="alarm-flash"></div>
    <canvas id="snapshot" style="display:none;"></canvas>

    <script>
        // --- 3D INTERAKTÍV HÁTTÉR (RED NEON) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.TorusKnotGeometry(12, 3, 120, 20);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        camera.position.z = 45;

        // Ujjal irányítható forgatás
        let targetRotationX = 0.01;
        let targetRotationY = 0.01;
        document.addEventListener('pointermove', (e) => {
            targetRotationY = (e.clientX - window.innerWidth / 2) * 0.005;
            targetRotationX = (e.clientY - window.innerHeight / 2) * 0.005;
        });

        function animate() {
            requestAnimationFrame(animate);
            mesh.rotation.x += (targetRotationX - mesh.rotation.x) * 0.05 + 0.005;
            mesh.rotation.y += (targetRotationY - mesh.rotation.y) * 0.05 + 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // --- RENDSZER LOGIKA ---
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: true }).then(s => video.srcObject = s);

        let config = JSON.parse(localStorage.getItem('phantomConfig')) || { phone: "", code: "1234", sid: "", token: "" };

        function checkAccess() {
            const val = document.getElementById('pass').value;
            if(val === config.code) {
                document.getElementById('status').innerText = "ACCESS GRANTED. WELCOME BACK.";
                document.getElementById('status').style.color = "#0f0";
            } else {
                triggerAlert();
            }
        }

        function triggerAlert() {
            document.getElementById('alarm').style.display = 'block';
            setTimeout(() => document.getElementById('alarm').style.display = 'none', 500);
            
            // Üzenetküldés (WhatsApp API hívás ha be van állítva)
            if(config.sid && config.token) {
                const url = `https://api.twilio.com/2010-04-01/Accounts/${config.sid}/Messages.json`;
                const auth = btoa(`${config.sid}:${config.token}`);
                const params = new URLSearchParams();
                params.append('To', `whatsapp:${config.phone}`);
                params.append('From', 'whatsapp:+14155238886');
                params.append('Body', '⚠️ PHANTOM CORP: Behatolási kísérlet észlelve!');
                fetch(url, { method: 'POST', headers: { 'Authorization': `Basic ${auth}`, 'Content-Type': 'application/x-www-form-urlencoded' }, body: params });
            }
            alert("SECURITY BREACH! Notification sent to authority.");
        }

        // Rejtett Admin megnyitása: hosszú nyomás (2mp) a bal felső sarokban
        let timer;
        const trigger = document.getElementById('admin-trigger');
        trigger.addEventListener('pointerdown', () => timer = setTimeout(() => document.getElementById('admin-panel').style.display='block', 2000));
        trigger.addEventListener('pointerup', () => clearTimeout(timer));

        function saveConfig() {
            config.phone = document.getElementById('c-phone').value;
            config.code = document.getElementById('c-code').value;
            config.sid = document.getElementById('c-sid').value;
            config.token = document.getElementById('c-token').value;
            localStorage.setItem('phantomConfig', JSON.stringify(config));
            document.getElementById('admin-panel').style.display = 'none';
        }
    </script>
</body>
</html>
